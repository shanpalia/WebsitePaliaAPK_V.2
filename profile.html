<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - PaliaAPK HUB</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .gradient-bg {
            background: linear-gradient(135deg, #16a34a, #22c55e);
        }
    </style>
</head>

<body class="bg-gray-50 min-h-screen">

    <!-- HEADER -->
    <header class="bg-white border-b border-gray-100 sticky top-0 z-50">
        <div class="max-w-5xl mx-auto px-4 py-4 flex items-center gap-4">

            <a href="index.html"
               class="w-10 h-10 rounded-xl bg-gray-100 hover:bg-green-50
                      flex items-center justify-center text-gray-700
                      hover:text-green-600 transition">
                <i class="fa-solid fa-arrow-left"></i>
            </a>

            <div>
                <h1 class="text-xl font-black text-gray-900">
                    My Profile
                </h1>

                <p class="text-xs text-gray-500">
                    PaliaAPK HUB
                </p>
            </div>

        </div>
    </header>


    <!-- MAIN -->
    <main class="max-w-5xl mx-auto px-4 py-8">

        <!-- PROFILE CARD -->
        <section class="bg-white rounded-3xl shadow-sm border
                        border-gray-100 overflow-hidden">

            <!-- TOP PROFILE AREA -->
            <div class="gradient-bg px-6 py-10 text-white">

                <div class="flex flex-col sm:flex-row
                            items-center sm:items-center gap-5">

                    <!-- Avatar -->
                    <div id="profileAvatar"
                         class="w-24 h-24 rounded-full bg-white
                                text-green-600 flex items-center
                                justify-center text-3xl font-black
                                shadow-lg">
                        SP
                    </div>

                    <div class="text-center sm:text-left">

                        <h2 id="profileName"
                            class="text-2xl sm:text-3xl font-black">
                            Loading...
                        </h2>

                        <p id="profileEmail"
                           class="text-sm text-white/80 mt-1">
                            Loading...
                        </p>

                        <div class="mt-3 inline-flex items-center gap-2
                                    bg-white/15 px-3 py-1.5 rounded-full
                                    text-xs font-bold">
                            <i class="fa-solid fa-circle-check"></i>
                            Verified Account
                        </div>

                    </div>

                </div>

            </div>


            <!-- ACCOUNT INFORMATION -->
            <div class="p-6">

                <h3 class="text-lg font-black text-gray-900 mb-5">
                    Account Information
                </h3>


                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">

                    <!-- Name -->
                    <div class="rounded-2xl bg-gray-50 border
                                border-gray-100 p-4">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-xl
                                        bg-green-50 text-green-600
                                        flex items-center justify-center">
                                <i class="fa-solid fa-user"></i>
                            </div>

                            <div>
                                <p class="text-xs text-gray-500">
                                    Name
                                </p>

                                <p id="infoName"
                                   class="font-bold text-gray-900">
                                    Loading...
                                </p>
                            </div>

                        </div>

                    </div>


                    <!-- Email -->
                    <div class="rounded-2xl bg-gray-50 border
                                border-gray-100 p-4">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-xl
                                        bg-green-50 text-green-600
                                        flex items-center justify-center">
                                <i class="fa-solid fa-envelope"></i>
                            </div>

                            <div class="min-w-0">

                                <p class="text-xs text-gray-500">
                                    Email
                                </p>

                                <p id="infoEmail"
                                   class="font-bold text-gray-900
                                          truncate">
                                    Loading...
                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- Login Provider -->
                    <div class="rounded-2xl bg-gray-50 border
                                border-gray-100 p-4">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-xl
                                        bg-green-50 text-green-600
                                        flex items-center justify-center">
                                <i class="fa-solid fa-right-to-bracket"></i>
                            </div>

                            <div>

                                <p class="text-xs text-gray-500">
                                    Login Method
                                </p>

                                <p id="loginMethod"
                                   class="font-bold text-gray-900">
                                    —
                                </p>

                            </div>

                        </div>

                    </div>


                    <!-- Account Status -->
                    <div class="rounded-2xl bg-gray-50 border
                                border-gray-100 p-4">

                        <div class="flex items-center gap-3">

                            <div class="w-10 h-10 rounded-xl
                                        bg-green-50 text-green-600
                                        flex items-center justify-center">
                                <i class="fa-solid fa-shield-halved"></i>
                            </div>

                            <div>

                                <p class="text-xs text-gray-500">
                                    Account Status
                                </p>

                                <p class="font-bold text-green-600">
                                    Active
                                </p>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ACTIONS -->
                <div class="border-t border-gray-100 mt-7 pt-6">

                    <div class="grid grid-cols-1 sm:grid-cols-2
                                gap-3">

                        <a href="downloads.html"
                           class="flex items-center justify-center
                                  gap-2 px-5 py-3.5 rounded-2xl
                                  bg-green-50 text-green-700
                                  font-bold text-sm
                                  hover:bg-green-100 transition">

                            <i class="fa-solid fa-download"></i>
                            My Downloads

                        </a>


                        <a href="favorites.html"
                           class="flex items-center justify-center
                                  gap-2 px-5 py-3.5 rounded-2xl
                                  bg-red-50 text-red-600
                                  font-bold text-sm
                                  hover:bg-red-100 transition">

                            <i class="fa-solid fa-heart"></i>
                            My Favorites

                        </a>

                    </div>

                </div>

            </div>

        </section>


        <!-- LOGOUT -->
        <div class="mt-5">

            <button id="logoutBtn"
                    class="w-full bg-white border border-red-100
                           text-red-600 rounded-2xl py-4
                           font-bold text-sm
                           hover:bg-red-50 transition">

                <i class="fa-solid fa-right-from-bracket mr-2"></i>
                Logout

            </button>

        </div>

    </main>


    <!-- FIREBASE LOGIC -->
    <script>

        // ===============================
        // FIREBASE CONFIGURATION
        // ===============================

        const firebaseConfig = {
            apiKey: "AIzaSyCn7GUkOaFO4l0x1zM5mwW4hFkW2ISxR10",
            authDomain: "shanpalia-apk-hub.firebaseapp.com",
            projectId: "shanpalia-apk-hub",
            storageBucket: "shanpalia-apk-hub.firebasestorage.app",
            messagingSenderId: "270953807883",
            appId: "1:270953807883:web:c900f4409938f16477870e",
            measurementId: "G-7BMQEGPY8C"
        };


        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }


        const auth = firebase.auth();


        // ===============================
        // AUTH STATE
        // ===============================

        auth.onAuthStateChanged((user) => {

            if (!user) {

                // Login नहीं है
                window.location.href = "user.html";

                return;
            }


            // User name
            const name =
                user.displayName ||
                (user.email
                    ? user.email.split("@")[0]
                    : "User");


            // Email
            const email = user.email || "No email";


            // Avatar initials
            const initials =
                name
                    .trim()
                    .split(/\s+/)
                    .map(word => word.charAt(0))
                    .join("")
                    .substring(0, 2)
                    .toUpperCase();


            // ===============================
            // UPDATE UI
            // ===============================

            document.getElementById("profileAvatar")
                .textContent = initials || "U";

            document.getElementById("profileName")
                .textContent = name;

            document.getElementById("profileEmail")
                .textContent = email;

            document.getElementById("infoName")
                .textContent = name;

            document.getElementById("infoEmail")
                .textContent = email;


            // ===============================
            // LOGIN METHOD
            // ===============================

            let loginMethod = "Email";

            if (user.providerData && user.providerData.length) {

                const provider =
                    user.providerData[0].providerId;

                if (provider === "google.com") {
                    loginMethod = "Google";
                }
                else if (provider === "password") {
                    loginMethod = "Email & Password";
                }
                else {
                    loginMethod = provider;
                }

            }


            document.getElementById("loginMethod")
                .textContent = loginMethod;

        });


        // ===============================
        // LOGOUT
        // ===============================

        document.getElementById("logoutBtn")
            .addEventListener("click", async () => {

                try {

                    await auth.signOut();

                    window.location.href = "index.html";

                }
                catch (error) {

                    console.error("Logout error:", error);

                    alert("Logout failed. Please try again.");

                }

            });

    </script>

</body>
</html>
