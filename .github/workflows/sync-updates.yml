name: Sync App Updates Manifest

on:
  workflow_dispatch:
  schedule:
    - cron: "7,22,37,52 * * * *"
  push:
    paths:
      - ".github/workflows/sync-updates.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Build universal updates.json from PaliaAPK HUB
        env:
          SUPABASE_URL: "https://ralinnuegsbuvlhwpzln.supabase.co"
          SUPABASE_ANON_KEY: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIF"
        run: |
          set -euo pipefail

          mkdir -p updates

          curl --fail --silent --show-error --retry 3 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/apps?select=name,package_name,version,apk_url,description,updated_at&package_name=not.is.null&version=not.is.null&order=name.asc" \
            -o /tmp/apps.json

          jq '{
            generated_at: (now | todateiso8601),
            apps: [
              .[] |
              select((.package_name // "") != "") |
              {
                app_name: (.name // ""),
                package_name: .package_name,
                latest_version: (.version // ""),
                download_url: (.apk_url // ""),
                release_notes: (.description // ""),
                force_update: false,
                updated_at: (.updated_at // null)
              }
            ]
          }' /tmp/apps.json > updates/updates.json

      - name: Commit manifest if changed
        run: |
          if git diff --quiet -- updates/updates.json; then
            echo "No manifest changes."
            exit 0
          fi

          git config user.name "PaliaAPK HUB Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add updates/updates.json
          git commit -m "chore: sync universal app updates manifest"
          git push
