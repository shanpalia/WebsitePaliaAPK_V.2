name: Deploy PaliaAPK HUB to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Generate sitemap from Supabase apps
        env:
          SUPABASE_URL: https://ralinnuegsbuvlhwpzln.supabase.co
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'sb_publishable_pXsTbFOseqm5uuA0hzqSzQ_UJxdvQi9' }}
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.parse, xml.etree.ElementTree as ET

          base = os.environ["SUPABASE_URL"].rstrip("/")
          key = os.environ.get("SUPABASE_ANON_KEY", "").strip()
          if not key:
              sys.exit("Missing Supabase publishable key; refusing to overwrite sitemap.")

          url = base + "/rest/v1/apps?select=id,updated_at&order=updated_at.desc"
          req = urllib.request.Request(url, headers={
              "apikey": key,
              "Authorization": "Bearer " + key,
              "Accept": "application/json"
          })
          try:
              with urllib.request.urlopen(req, timeout=30) as response:
                  apps = json.load(response)
          except Exception as exc:
              sys.exit("Supabase query failed; refusing to publish an incomplete sitemap. " + str(exc))

          if not isinstance(apps, list):
              sys.exit("Unexpected Supabase response; refusing to publish.")

          ns = "http://www.sitemaps.org/schemas/sitemap/0.9"
          ET.register_namespace("", ns)
          root = ET.Element("{" + ns + "}urlset")
          urls = [("https://paliaapkhub.com/", None)]
          seen = set()
          for app in apps:
              app_id = app.get("id")
              if app_id is None:
                  continue
              loc = "https://paliaapkhub.com/app.html?id=" + urllib.parse.quote(str(app_id), safe="")
              if loc not in seen:
                  urls.append((loc, app.get("updated_at")))
                  seen.add(loc)

          for loc, lastmod in urls:
              node = ET.SubElement(root, "{" + ns + "}url")
              ET.SubElement(node, "{" + ns + "}loc").text = loc
              if lastmod:
                  ET.SubElement(node, "{" + ns + "}lastmod").text = str(lastmod)[:10]

          ET.ElementTree(root).write("sitemap.xml", encoding="utf-8", xml_declaration=True)
          print("Generated sitemap with", len(urls), "URLs (" + str(len(apps)) + " Supabase app rows).")
          PY

      - name: Prepare Pages artifact
        run: |
          mkdir _site
          tar --exclude='./.git' --exclude='./.github' --exclude='./_site' -cf - . | tar -xf - -C _site

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
