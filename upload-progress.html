<!-- HTML Structure -->
<div class="pub-modal-overlay" id="uploadModal" aria-hidden="true">
    <div class="pub-modal-card">

                    <div class="pub-step-header">

</div>

<!-- CSS Styles -->
<style>
    /* CSS Variables scoped to Dialog Popup */
    :root {
        --pub-primary: #2563eb;
        --pub-primary-glow: rgba(37, 99, 235, 0.22);
        --pub-success: #10b981;
        --pub-success-light: #ecfdf5;
        --pub-text-main: #0f172a;
        --pub-text-muted: #64748b;
        --pub-border-light: rgba(226, 232, 240, 0.85);
        --pub-bg-glass: rgba(255, 255, 255, 0.92);
        --pub-card-bg: rgba(255, 255, 255, 0.75);
        --pub-radius-lg: 24px;
        --pub-radius-md: 16px;
        --pub-radius-sm: 12px;
        --pub-shadow-modal: 0 25px 50px -12px rgba(15, 23, 42, 0.3);
        --pub-transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* Modal Dark Overlay */
    .pub-modal-overlay {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        display: flex;
        align-items: center;
        justify-content: center;
        opacity: 0;
        visibility: hidden;
        transition: opacity 0.35s ease, visibility 0.35s ease;
        z-index: 9999;
        padding: 16px;
    }

    .pub-modal-overlay.active {
        opacity: 1;
        visibility: visible;
    }

    /* Popup Modal Container */
    .pub-modal-card {
        background: var(--pub-bg-glass);
        border: 1px solid rgba(255, 255, 255, 0.95);
        border-radius: var(--pub-radius-lg);
        width: 550px;
        max-width: 95%;
        box-shadow: var(--pub-shadow-modal);
        transform: scale(0.92) translateY(18px);
        transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.35s ease;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        max-height: 88vh;
        color: var(--pub-text-main);
    }

    .pub-modal-overlay.active .pub-modal-card {
        transform: scale(1) translateY(0);
    }

    /* Header */
    .pub-modal-header {
        padding: 24px 28px 16px 28px;
        border-bottom: 1px solid var(--pub-border-light);
        background: rgba(255, 255, 255, 0.5);
    }

    .pub-modal-title {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 21px;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--pub-text-main);
    }

    .pub-modal-subtitle {
        color: var(--pub-text-muted);
        font-size: 13.5px;
        margin-top: 4px;
    }

    /* Body Container */
    .pub-modal-body {
        padding: 20px 28px;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: 14px;
    }

    /* Upload Cards */
    .pub-step-card {
        background: var(--pub-card-bg);
        border: 1px solid var(--pub-border-light);
        border-radius: var(--pub-radius-md);
        padding: 14px 16px;
        display: flex;
        align-items: center;
        gap: 14px;
        transition: var(--pub-transition);
    }

    /* Status States */
    .pub-step-card.pending {
        opacity: 0.5;
        filter: grayscale(80%);
    }

    .pub-step-card.active {
        opacity: 1;
        filter: none;
        border-color: var(--pub-primary);
        box-shadow: 0 0 0 4px var(--pub-primary-glow);
        background: #ffffff;
        transform: scale(1.01);
    }

    .pub-step-card.completed {
        opacity: 1;
        filter: none;
        border-color: rgba(16, 185, 129, 0.35);
        background: var(--pub-success-light);
    }

    /* Thumbnail Box */
    .pub-thumb-box {
        width: 52px;
        height: 52px;
        border-radius: var(--pub-radius-sm);
        background: #f1f5f9;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        flex-shrink: 0;
        border: 1px solid rgba(0, 0, 0, 0.06);
    }

    .pub-thumb-box img {
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .pub-thumb-box svg {
        width: 24px;
        height: 24px;
        color: var(--pub-text-muted);
    }

    /* Step Info */
    .pub-step-info {
        flex-grow: 1;
        min-width: 0;
    }

    .pub-step-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 6px;
    }

    .pub-step-title {
        font-weight: 600;
        font-size: 14px;
        color: var(--pub-text-main);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .pub-step-percentage {
        font-size: 13px;
        font-weight: 700;
        color: var(--pub-primary);
    }

    .pub-step-card.completed .pub-step-percentage {
        color: var(--pub-success);
    }

    /* Progress Bar */
    .pub-progress-track {
        height: 8px;
        width: 100%;
        background: #e2e8f0;
        border-radius: 99px;
        overflow: hidden;
        position: relative;
    }

    .pub-progress-fill {
        height: 100%;
        width: 0%;
        background: linear-gradient(90deg, #3b82f6, #2563eb);
        border-radius: 99px;
        transition: width 0.15s ease-out;
        position: relative;
    }

    .pub-step-card.active .pub-progress-fill::after {
        content: '';
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        background: linear-gradient(90deg, rgba(255,255,255,0) 0%, rgba(255,255,255,0.45) 50%, rgba(255,255,255,0) 100%);
        animation: pub-shimmer 1.5s infinite;
    }

    @keyframes pub-shimmer {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(100%); }
    }

    .pub-step-card.completed .pub-progress-fill {
        background: linear-gradient(90deg, #34d399, #10b981);
    }

    /* Completion View */
    .pub-completion-screen {
        display: none;
        flex-direction: column;
        align-items: center;
        text-align: center;
        padding: 32px 20px 24px 20px;
        animation: pub-fadeIn 0.4s ease forwards;
    }

    @keyframes pub-fadeIn {
        from { opacity: 0; transform: translateY(8px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .pub-status-icon-wrapper {
        width: 76px;
        height: 76px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-bottom: 18px;
        background: var(--pub-success-light);
        box-shadow: 0 0 0 10px rgba(16, 185, 129, 0.12);
        animation: pub-popIn 0.45s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    @keyframes pub-popIn {
        0% { transform: scale(0); }
        100% { transform: scale(1); }
    }

    .pub-status-icon-wrapper svg {
        width: 42px;
        height: 42px;
        color: var(--pub-success);
    }

    .pub-completion-title {
        font-family: system-ui, -apple-system, sans-serif;
        font-size: 22px;
        font-weight: 700;
        color: var(--pub-text-main);
        margin-bottom: 8px;
    }

    .pub-completion-subtitle {
        color: var(--pub-text-muted);
        font-size: 14px;
        max-width: 360px;
        margin-bottom: 24px;
        line-height: 1.5;
    }

    .pub-btn-done {
        background: linear-gradient(135deg, #10b981, #059669);
        color: white;
        border: none;
        padding: 13px 40px;
        font-size: 15px;
        font-weight: 600;
        border-radius: 99px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
        transition: var(--pub-transition);
        width: 100%;
        max-width: 220px;
    }

    .pub-btn-done:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(16, 185, 129, 0.45);
    }

    .pub-checkmark-path {
        stroke-dasharray: 50;
        stroke-dashoffset: 50;
        animation: pub-stroke 0.4s cubic-bezier(0.65, 0, 0.45, 1) 0.15s forwards;
    }

    @keyframes pub-stroke {
        100% { stroke-dashoffset: 0; }
    }

    /* Body Fade Out Transition */
    body.pub-fade-out {
        opacity: 0;
        transition: opacity 0.8s ease;
    }
</style>

<!-- JavaScript Dialog Logic -->
<script>
    (function () {
        // Thumbnail previews
        const PUB_PREVIEWS = {
            icon: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%232563eb"/><path d="M30 70 L50 30 L70 70 Z" fill="%23ffffff"/></svg>',
            banner: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="200" height="100" viewBox="0 0 200 100"><rect width="200" height="100" fill="%233b82f6"/><circle cx="150" cy="30" r="20" fill="%2360a5fa" opacity="0.6"/><path d="M0 100 L80 40 L140 80 L200 30 L200 100 Z" fill="%231d4ed8"/></svg>',
            screenshots: [
                'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="180" viewBox="0 0 100 180"><rect width="100" height="180" fill="%23f8fafc"/><rect x="10" y="10" width="80" height="120" rx="8" fill="%23e2e8f0"/><circle cx="50" cy="155" r="8" fill="%23cbd5e1"/></svg>',
                'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="180" viewBox="0 0 100 180"><rect width="100" height="180" fill="%23f8fafc"/><rect x="10" y="10" width="80" height="120" rx="8" fill="%233b82f6"/><circle cx="50" cy="155" r="8" fill="%23cbd5e1"/></svg>',
                'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="180" viewBox="0 0 100 180"><rect width="100" height="180" fill="%23f8fafc"/><rect x="10" y="10" width="80" height="120" rx="8" fill="%2310b981"/><circle cx="50" cy="155" r="8" fill="%23cbd5e1"/></svg>',
                'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="180" viewBox="0 0 100 180"><rect width="100" height="180" fill="%23f8fafc"/><rect x="10" y="10" width="80" height="120" rx="8" fill="%23f59e0b"/><circle cx="50" cy="155" r="8" fill="%23cbd5e1"/></svg>',
                'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="180" viewBox="0 0 100 180"><rect width="100" height="180" fill="%23f8fafc"/><rect x="10" y="10" width="80" height="120" rx="8" fill="%238b5cf6"/><circle cx="50" cy="155" r="8" fill="%23cbd5e1"/></svg>'
            ],
            apk: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%2310b981"/><path d="M30 40 Q50 20 70 40 L70 70 Q50 80 30 70 Z" fill="%23ffffff"/></svg>',
            info: 'data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="100" height="100" viewBox="0 0 100 100"><rect width="100" height="100" rx="20" fill="%236366f1"/><rect x="25" y="25" width="50" height="10" rx="4" fill="%23ffffff"/><rect x="25" y="45" width="50" height="10" rx="4" fill="%23ffffff"/><rect x="25" y="65" width="30" height="10" rx="4" fill="%23ffffff"/></svg>'
        };

        const uploadModal = document.getElementById('uploadModal');
        const pubDoneBtn = document.getElementById('pubDoneBtn');
        const pubModalHeader = document.getElementById('pubModalHeader');
        const pubUploadBody = document.getElementById('pubUploadBody');
        const pubCompletionScreen = document.getElementById('pubCompletionScreen');

        // Smooth progress animation helper
        function animateStepProgress(cardEl, duration, onComplete, successMsgText, thumbSrc) {
            const fill = cardEl.querySelector('.pub-progress-fill');
            const percentText = cardEl.querySelector('.pub-step-percentage');
            const thumbBox = cardEl.querySelector('.pub-thumb-box');

            if (thumbSrc) {
                thumbBox.innerHTML = `<img src="${thumbSrc}" alt="preview">`;
            }

            cardEl.className = 'pub-step-card active';
            let startTimestamp = null;

            function step(timestamp) {
                if (!startTimestamp) startTimestamp = timestamp;
                const elapsed = timestamp - startTimestamp;
                const progress = Math.min(Math.floor((elapsed / duration) * 100), 100);

                fill.style.width = progress + '%';
                percentText.textContent = progress + '%';

                if (progress < 100) {
                    requestAnimationFrame(step);
                } else {
                    cardEl.className = 'pub-step-card completed';
                    percentText.innerHTML = successMsgText || `✔ Completed`;
                    setTimeout(onComplete, 350);
                }
            }

            requestAnimationFrame(step);
        }
window.setPublishStep = function(step, percent, text){

    const card = document.getElementById(step);

    if(!card) return;

    card.classList.remove("pending");
    card.classList.add("active");

    card.querySelector(".pub-progress-fill").style.width =
        percent + "%";

    card.querySelector(".pub-step-percentage").textContent =
        percent + "%";

    if(percent>=100){

        card.classList.remove("active");
        card.classList.add("completed");

        card.querySelector(".pub-step-percentage").innerHTML =
            text || "✔ Completed";

    }

}
        // Global function to trigger dialog startup
        window.openPublishProgressDialog = function() {
            // Reset dialog state
            pubModalHeader.style.display = 'block';
            pubUploadBody.style.display = 'flex';
            pubCompletionScreen.style.display = 'none';

            const steps = document.querySelectorAll('.pub-step-card');
            steps.forEach(s => {
                s.className = 'pub-step-card pending';
                s.querySelector('.pub-progress-fill').style.width = '0%';
                s.querySelector('.pub-step-percentage').textContent = '0%';
            });

            uploadModal.classList.add('active');
            uploadModal.setAttribute('aria-hidden', 'false');

            // 1. App Icon
            setTimeout(() => {
                const iconCard = document.getElementById('step-icon');
                animateStepProgress(iconCard, 1800, () => {
                    
                    // 2. Banner
                    const bannerCard = document.getElementById('step-banner');
                    animateStepProgress(bannerCard, 2200, () => {

                        // 3. Screenshot 1/5 through 5/5
                        let shotIndex = 0;
                        const shotCard = document.getElementById('step-screenshot');
                        const shotTitle = document.getElementById('shot-title');

                        function processScreenshotQueue() {
                            if (shotIndex < 5) {
                                shotTitle.textContent = `Uploading Screenshot ${shotIndex + 1} / 5`;
                                shotCard.querySelector('.pub-progress-fill').style.width = '0%';
                                
                                animateStepProgress(
                                    shotCard, 
                                    1100, 
                                    () => {
                                        shotIndex++;
                                        processScreenshotQueue();
                                    },
                                    null,
                                    PUB_PREVIEWS.screenshots[shotIndex]
                                );
                            } else {
                                shotTitle.textContent = `Screenshots Uploaded`;
                                // 4. APK Upload
                                const apkCard = document.getElementById('step-apk');
                                animateStepProgress(
                                    apkCard, 
                                    3000, 
                                    () => {
                                        // 5. Save App Information
                                        const infoCard = document.getElementById('step-info');
                                        animateStepProgress(
                                            infoCard, 
                                            1600, 
                                            () => {
                                                // Completion
                                                pubModalHeader.style.display = 'none';
                                                pubUploadBody.style.display = 'none';
                                                pubCompletionScreen.style.display = 'flex';
                                            },
                                            '✔ Saved Successfully',
                                            PUB_PREVIEWS.info
                                        );
                                    },
                                    '✔ APK Uploaded',
                                    PUB_PREVIEWS.apk
                                );
                            }
                        }

                        processScreenshotQueue();

                    }, '✔ Banner Uploaded', PUB_PREVIEWS.banner);

                }, '✔ Icon Uploaded', PUB_PREVIEWS.icon);

            }, 300);
        };

        // Done button action
        pubDoneBtn.addEventListener('click', () => {
            uploadModal.classList.remove('active');
            uploadModal.setAttribute('aria-hidden', 'true');

            setTimeout(() => {
                document.body.classList.add('pub-fade-out');
                setTimeout(() => {
                    window.location.href = 'dashboard.html';
                }, 800);
            }, 300);
        });

        // Trigger binding for publish buttons
        document.addEventListener('click', function(e) {
            const btn = e.target.closest('#startPublishBtn, .publish-btn, [data-action="publish"]');
            if (btn) {
                e.preventDefault();
                window.openPublishProgressDialog();
            }
        });
    })();
</script>
