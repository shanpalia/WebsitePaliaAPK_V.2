const SUPABASE_URL = "https://ralinnuegsbuvlhwpzln.supabase.co";

const SUPABASE_ANON_KEY = "sb_publishable_pXsTbFOseqm5uuA0hzqSzQ_UJxdvQi9";

const supabaseClient = window.supabase.createClient(

async function syncUserToSupabase(user) {

    if (!user) return;

    const { error } = await supabaseClient
        .from("users")
        .upsert({
            id: user.uid,
            email: user.email || null,
            name: user.displayName || null,
            last_login_at: new Date().toISOString()
        }, {
            onConflict: "id"
        });

    if (error) {
        console.error("User sync error:", error);
    } else {
        console.log("Firebase user synced to Supabase.");
    }
}
        // Parse URL Redirect parameters
        const urlParams = new URLSearchParams(window.location.search);
        let redirectTarget = urlParams.get('redirect') || 'index.html';
        
        // Handle nested redirect query structures if any (e.g. download.html?id=XYZ)
        if (window.location.search.includes('redirect=')) {
            const fullQueryStr = window.location.search.substring(1);
            const redirectIndex = fullQueryStr.indexOf('redirect=');
            if (redirectIndex !== -1) {
                redirectTarget = decodeURIComponent(fullQueryStr.substring(redirectIndex + 9));
            }
        }

        // Persistent / Remember Login Configuration & Auto-Redirect
        const rememberPreference = localStorage.getItem('palia_remember_me') === 'true';
        if (rememberPreference) {
            auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
        } else {
            auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
        }

        // Safe redirect after authentication. Only allow local pages and preserve the full query.
        function safeRedirect() {
            const fallback = 'index.html';
            let target = redirectTarget || fallback;

            try {
                target = decodeURIComponent(target);
            } catch (_) {}

            // Never allow external URLs or javascript/data schemes.
            if (/^(https?:|javascript:|data:|\/\/)/i.test(target)) {
                target = fallback;
            }

            // Keep redirects inside this app.
            if (target.startsWith('/')) target = target.slice(1);
            if (target.includes('\\')) target = fallback;

            window.location.replace(target || fallback);
        }

        // Restore the page target before Firebase emits the initial auth state.
        restoreGoogleRedirectTarget();

        // Auto-redirect if already logged in
        auth.onAuthStateChanged(async (user) => {

    if (user) {

        await syncUserToSupabase(user);

        safeRedirect();
    }

});

        // Toast Notification Helper
        function showToast(message, type = 'error') {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toastMsg');
            const toastIcon = document.getElementById('toastIcon');

            toastMsg.textContent = message;
            toast.classList.remove('hidden');
            toast.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'border-red-200', 'bg-mint-50', 'text-mint-700', 'border-mint-200');

            if (type === 'success') {
                toast.classList.add('bg-mint-50', 'text-mint-700', 'border', 'border-mint-200');
                toastIcon.className = 'ui-icon text-mint-600 text-sm';
                toastIcon.textContent = '✓';
            } else {
                toast.classList.add('bg-red-50', 'text-red-700', 'border', 'border-red-200');
                toastIcon.className = 'ui-icon text-red-600 text-sm';
                toastIcon.textContent = '!';
            }
        }

        // Tab Switching Logic
        function switchTab(tab) {
            const loginForm = document.getElementById('loginForm');
            const signupForm = document.getElementById('signupForm');
            const loginTabBtn = document.getElementById('loginTabBtn');
            const signupTabBtn = document.getElementById('signupTabBtn');

            document.getElementById('toast').classList.add('hidden');

            if (tab === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTabBtn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-gray-700 bg-white shadow-sm';
                signupTabBtn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-gray-500 hover:text-gray-900';
            } else {
                signupForm.classList.remove('hidden');
                loginForm.classList.add('hidden');
                signupTabBtn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-gray-700 bg-white shadow-sm';
                loginTabBtn.className = 'flex-1 py-2.5 rounded-xl text-xs font-bold transition-all text-gray-500 hover:text-gray-900';
            }
        }

        // Password Visibility Toggle
        function togglePassword(inputId, iconId) {
            const input = document.getElementById(inputId);
            const icon = document.getElementById(iconId);
            if (input.type === 'password') {
                input.type = 'text';
                icon.className = 'ui-icon';
                icon.textContent = '◉';
            } else {
                input.type = 'password';
                icon.className = 'ui-icon';
                icon.textContent = '◉';
            }
        }

        function friendlyAuthError(error) {
            const code = error?.code || '';
            const messages = {
                'auth/invalid-credential': 'Email or password is incorrect.',
                'auth/invalid-login-credentials': 'Email or password is incorrect.',
                'auth/wrong-password': 'Email or password is incorrect.',
                'auth/user-not-found': 'No account found with this email.',
                'auth/email-already-in-use': 'An account already exists with this email.',
                'auth/invalid-email': 'Please enter a valid email address.',
                'auth/weak-password': 'Password must be at least 6 characters long.',
                'auth/too-many-requests': 'Too many attempts. Please try again later.',
                'auth/popup-closed-by-user': 'Google login was cancelled.',
                'auth/network-request-failed': 'Network error. Check your internet connection.',
                'auth/operation-not-allowed': 'This login method is not enabled in Firebase.'
            };
            return messages[code] || error?.message || 'Login failed. Please try again.';
        }

        // Email Login Handler
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value.trim();
            const password = document.getElementById('loginPassword').value.trim();
            const rememberMe = document.getElementById('rememberMe').checked;
            const btn = document.getElementById('loginSubmitBtn');

            localStorage.setItem('palia_remember_me', rememberMe ? 'true' : 'false');
            if (rememberMe) {
                await auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL);
            } else {
                await auth.setPersistence(firebase.auth.Auth.Persistence.SESSION);
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="ui-spinner" aria-hidden="true"></span> Logging in...';

            try {
                await auth.signInWithEmailAndPassword(email, password);
                showToast('Login successful! Redirecting...', 'success');
                setTimeout(() => {
                    safeRedirect();
                }, 800);
            } catch (error) {
                showToast(friendlyAuthError(error));
                btn.disabled = false;
                btn.innerHTML = '<span>Login</span><span class="ui-icon">→</span>';
            }
        });

        // Email Signup Handler
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('signupName').value.trim();
            const email = document.getElementById('signupEmail').value.trim();
            const password = document.getElementById('signupPassword').value.trim();
            const confirmPassword = document.getElementById('signupConfirmPassword').value.trim();
            const btn = document.getElementById('signupSubmitBtn');

            if (password !== confirmPassword) {
                showToast('Passwords do not match.');
                return;
            }

            if (password.length < 6) {
                showToast('Password must be at least 6 characters long.');
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="ui-spinner" aria-hidden="true"></span> Creating account...';

            try {
                const userCredential = await auth.createUserWithEmailAndPassword(email, password);
                if (name) {
                    await userCredential.user.updateProfile({ displayName: name });
                }
                showToast('Account created successfully! Redirecting...', 'success');
                setTimeout(() => {
                    safeRedirect();
                }, 800);
            } catch (error) {
                showToast(friendlyAuthError(error));
                btn.disabled = false;
                btn.innerHTML = '<span>Create Account</span><span class="ui-icon">+</span>';
            }
        });



        // Forgot Password Handler
        async function handleForgotPassword() {
            const email = document.getElementById('loginEmail').value.trim();
            if (!email) {
                showToast('Please enter your email address in the login form first.');
                document.getElementById('loginEmail').focus();
                return;
            }

            try {
                await auth.sendPasswordResetEmail(email);
                showToast('Password reset link sent to your email.', 'success');
            } catch (error) {
                showToast(friendlyAuthError(error));
            }
        }
  
// ===============================
// GOOGLE LOGIN - FIREBASE WEB REDIRECT
// ===============================

// Preserve the page the user was trying to open before leaving for Google.
function saveGoogleRedirectTarget() {
    try {
        sessionStorage.setItem('palia_google_redirect', redirectTarget || 'index.html');
    } catch (_) {}
}

function restoreGoogleRedirectTarget() {
    try {
        const saved = sessionStorage.getItem('palia_google_redirect');
        if (saved) {
            redirectTarget = saved;
            sessionStorage.removeItem('palia_google_redirect');
        }
    } catch (_) {}
}

// Complete a Firebase Web redirect when Google sends the user back.
(async function handleGoogleRedirectResult() {
    try {
        const result = await auth.getRedirectResult();
        if (result && result.user) {
            await syncUserToSupabase(result.user);
            safeRedirect();
        }
    } catch (error) {
        console.error('Google redirect login error:', error);
        showToast(friendlyAuthError(error));
    }
})();

document.getElementById('googleLoginBtn').addEventListener('click', async () => {
    const btn = document.getElementById('googleLoginBtn');
    btn.disabled = true;
    btn.innerHTML = '<span class="ui-spinner" aria-hidden="true"></span> Opening Google...';

    try {
        const isAndroidApp = !!window.Capacitor &&
            typeof window.Capacitor.getPlatform === 'function' &&
            window.Capacitor.getPlatform() === 'android';

        if (isAndroidApp && window.PaliaNativeGoogle) {
            // Android: native Credential Manager account chooser; no browser redirect.
            const nativeResult = await window.PaliaNativeGoogle.signIn();
            const credential = firebase.auth.GoogleAuthProvider.credential(nativeResult.idToken);
            const result = await auth.signInWithCredential(credential);
            await syncUserToSupabase(result.user);
            showToast('Google login successful! Redirecting...', 'success');
            setTimeout(() => safeRedirect(), 500);
            return;
        }

        // Website/PWA fallback: Firebase Web redirect.
        saveGoogleRedirectTarget();
        const provider = new firebase.auth.GoogleAuthProvider();
        provider.setCustomParameters({ prompt: 'select_account' });
        await auth.signInWithRedirect(provider);
    } catch (error) {
        console.error('Google Login Error:', error);
        showToast(friendlyAuthError(error));
        btn.disabled = false;
        btn.innerHTML = '<span class="google-glyph" aria-hidden="true">G</span> Continue with Google';
    }
});
