workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120

    environment:
      node: latest
      java: 21

      android_signing:
        - paliaapk-release

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install firebase
          npm install @capacitor/push-notifications@8.1.2
          npm install @capacitor-firebase/authentication@8.3.0

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: Root index.html not found"
            pwd
            ls -la
            exit 1
          fi

          cp index.html www/index.html

          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then
              cp "$file" www/
            fi
          done

          if [ -d "assets" ]; then
            cp -r assets www/
          fi

          if [ -d "images" ]; then
            cp -r images www/
          fi

          # This project uses plain HTML instead of a module bundler.
          # Capacitor's runtime must be present before the Firebase plugin bridge.
          test -f node_modules/@capacitor/core/dist/capacitor.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          test -s www/capacitor.js

          # Load the Capacitor runtime before native plugin scripts on every page.
          python3 <<'PY2'
          from pathlib import Path
          for p in Path("www").glob("*.html"):
              text = p.read_text()
              if 'src="capacitor.js"' not in text:
                  marker = '<head>'
                  if marker in text:
                      text = text.replace(marker, marker + '\n    <script src="capacitor.js"></script>', 1)
                  else:
                      text = '<script src="capacitor.js"></script>\n' + text
                  p.write_text(text)
          PY2

          test -f www/index.html

          echo "===== WWW CONTENT ====="
          ls -la www

      - name: Prepare Firebase Authentication web bridge
        script: |
          set -e
          cat > www/capacitor-auth.js <<'EOF'
          // Do not bundle another copy of Capacitor.
          // The native FirebaseAuthentication plugin is registered by Capacitor
          // from android/app/src/main/assets/capacitor.plugins.json.
          window.FirebaseAuthentication =
            window.Capacitor?.Plugins?.FirebaseAuthentication || null;
          EOF
          test -s www/capacitor-auth.js
          echo "FirebaseAuthentication bridge will use the native Capacitor plugin."

      - name: Create Android project
        script: |
          set -e
          rm -rf android
          test -f capacitor.config.ts
          echo "===== Capacitor config ====="
          cat capacitor.config.ts
          npx cap config
          npx cap add android

      - name: Configure Firebase Google Sign-In
        script: |
          python3 <<'PY'
          from pathlib import Path
          
          file = Path("android/variables.gradle")
          
          if not file.exists():
              raise SystemExit("android/variables.gradle not found")
          
          text = file.read_text()
          
          if "rgcfaIncludeGoogle" not in text:
              if "ext {" in text:
                  text = text.replace(
                      "ext {",
                      """ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'""",
                      1
                  )
              else:
                  text += """
          
          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          """
          
          file.write_text(text)
          
          print("Firebase Google Sign-In configured.")
          PY

          echo "===== variables.gradle ====="
          cat android/variables.gradle

      - name: Verify Capacitor Firebase Authentication plugin
        script: |
          set -e
          echo "Verifying Firebase Authentication plugin package before native project generation..."
          npm list @capacitor-firebase/authentication
          test -d node_modules/@capacitor-firebase/authentication
          echo "Firebase Authentication plugin package is installed."

      - name: Add Firebase configuration
        script: |
          mkdir -p android/app

          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase google-services.json added successfully."

      - name: Generate PaliaAPK HUB icon
        script: |
          npx @capacitor/assets generate --android

      - name: Update Capacitor Native Plugins
        script: |
          npx cap update android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Force Firebase Authentication native module and MainActivity registration
        script: |
          set -e
          PLUGIN_DIR="node_modules/@capacitor-firebase/authentication/android"
          test -d "$PLUGIN_DIR"
          test -f "$PLUGIN_DIR/build.gradle"

          SETTINGS="android/capacitor.settings.gradle"
          if ! grep -q "include ':capacitor-firebase-authentication'" "$SETTINGS"; then
            printf "\ninclude ':capacitor-firebase-authentication'\nproject(':capacitor-firebase-authentication').projectDir = new File('../node_modules/@capacitor-firebase/authentication/android')\n" >> "$SETTINGS"
          fi

          APP_GRADLE="android/app/build.gradle"
          if ! grep -q "project(':capacitor-firebase-authentication')" "$APP_GRADLE"; then
            python3 - <<'PY2'
          from pathlib import Path
          p = Path("android/app/build.gradle")
          s = p.read_text()
          marker = "dependencies {"
          if marker not in s:
              raise SystemExit("dependencies block not found in android/app/build.gradle")
          s = s.replace(marker, marker + "\n    implementation project(':capacitor-firebase-authentication')", 1)
          p.write_text(s)
          PY2
          fi

          PLUGINS="android/app/src/main/assets/capacitor.plugins.json"
          python3 - <<'PY3'
          import json
          from pathlib import Path
          f = Path("android/app/src/main/assets/capacitor.plugins.json")
          d = json.loads(f.read_text()) if f.exists() else []
          e = {"pkg":"@capacitor-firebase/authentication","classpath":"io.capawesome.capacitorjs.plugins.firebase.authentication.FirebaseAuthenticationPlugin"}
          d = [x for x in d if x.get("pkg") != e["pkg"]]
          d.insert(0, e)
          f.write_text(json.dumps(d, indent=2) + "\n")
          PY3

          MAIN="android/app/src/main/java/com/shanpalia/paliaapkhub/MainActivity.java"
          test -f "$MAIN"
          python3 - <<'PY4'
          from pathlib import Path
          p = Path("android/app/src/main/java/com/shanpalia/paliaapkhub/MainActivity.java")
          s = p.read_text()
          imp = "import io.capawesome.capacitorjs.plugins.firebase.authentication.FirebaseAuthenticationPlugin;"
          if imp not in s:
              s = s.replace("import com.getcapacitor.BridgeActivity;", "import com.getcapacitor.BridgeActivity;\n" + imp)
          if "registerPlugin(FirebaseAuthenticationPlugin.class);" not in s:
              if "public void onCreate(Bundle savedInstanceState)" in s:
                  s = s.replace("public void onCreate(Bundle savedInstanceState) {", "public void onCreate(Bundle savedInstanceState) {\n        registerPlugin(FirebaseAuthenticationPlugin.class);", 1)
              else:
                  s = s.replace("public class MainActivity extends BridgeActivity {", "public class MainActivity extends BridgeActivity {\n    @Override\n    public void onCreate(android.os.Bundle savedInstanceState) {\n        registerPlugin(FirebaseAuthenticationPlugin.class);\n        super.onCreate(savedInstanceState);\n    }")
          p.write_text(s)
          PY4

          echo "===== Native Firebase module ====="
          grep -n "capacitor-firebase-authentication" "$SETTINGS" "$APP_GRADLE"
          echo "===== MainActivity ====="
          grep -n -A2 -B2 "FirebaseAuthenticationPlugin" "$MAIN"
          echo "===== Plugin metadata ====="
          grep -n -A2 -B1 "@capacitor-firebase/authentication" "$PLUGINS"
          test -d "$PLUGIN_DIR/src/main"
          echo "Native Firebase Authentication module and explicit MainActivity registration are configured."

      - name: Verify native Firebase Authentication registration
        script: |
          set -e
          echo "Checking Capacitor native plugin registration..."
          test -f www/capacitor.js
          test -s www/capacitor.js
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -q 'FirebaseAuthentication' android/app/src/main/assets/capacitor.plugins.json
          echo "FirebaseAuthentication is registered in Capacitor plugin metadata."
          echo "Checking generated Android Firebase Authentication sources..."
          find android -type f \
            \( -iname "*FirebaseAuthentication*" -o -iname "*FirebaseAuthenticationPlugin*" \) \
            -not -path '*/build/*' \
            -not -path '*/.gradle/*' \
            -print | head -50
          echo "Native Firebase Authentication plugin verification passed."

      - name: Verify Firebase Native Plugin
        script: |
          set -e

          echo "========================================"
          echo "1. NPM FIREBASE AUTHENTICATION"
          echo "========================================"

          npm list @capacitor-firebase/authentication

          echo "========================================"
          echo "2. CAPACITOR PLUGINS"
          echo "========================================"

          npx cap ls

          echo "========================================"
          echo "3. CAPACITOR PLUGIN JSON"
          echo "========================================"

          test -f android/app/src/main/assets/capacitor.plugins.json
          cat android/app/src/main/assets/capacitor.plugins.json
          grep -q 'FirebaseAuthentication' android/app/src/main/assets/capacitor.plugins.json
          echo "FirebaseAuthentication is registered in Capacitor plugin metadata."

          echo "========================================"
          echo "4. FIREBASE NATIVE CLASS"
          echo "========================================"

          find android -type f \
            \( -iname "*FirebaseAuthentication*" -o -iname "*FirebaseAuthenticationPlugin*" \) \
            -print

          echo "========================================"
          echo "5. NATIVE REGISTRATION"
          echo "========================================"

          grep -R "FirebaseAuthenticationPlugin" android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            || true

          echo "========================================"
          echo "6. FIREBASE GRADLE REFERENCES"
          echo "========================================"

          grep -R "capacitor-firebase" android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            || true

          echo "========================================"
          echo "7. JAVASCRIPT BRIDGE"
          echo "========================================"

          test -f www/capacitor-auth.js
          test -s www/capacitor-auth.js
          grep -q "FirebaseAuthentication" www/capacitor-auth.js

          echo "Capacitor + Firebase JS bridge OK."

          echo "========================================"
          echo "8. ANDROID ASSETS"
          echo "========================================"

          ls -la android/app/src/main/assets/

          echo "========================================"
          echo "DIAGNOSTIC COMPLETE"
          echo "========================================"

      - name: Final Firebase Authentication plugin check
        script: |
          set -e
          echo "Final Firebase Authentication checks..."
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -q 'FirebaseAuthentication' android/app/src/main/assets/capacitor.plugins.json
          test -s www/capacitor-auth.js
          grep -q 'google.com' capacitor.config.ts
          grep -q 'googleWebClientId' capacitor.config.ts
          echo "FirebaseAuthentication plugin, Google provider, and JS bridge verified."

      - name: Configure Android signing
        script: |
          python3 <<'PY'
          from pathlib import Path
          import re
          
          file = Path("android/app/build.gradle")
          
          if not file.exists():
              raise SystemExit("android/app/build.gradle not found")
          
          text = file.read_text()
          
          if "signingConfigs {" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              """
          
              marker = "    buildTypes {"
          
              if marker not in text:
                  raise SystemExit(
                      "Could not find buildTypes in android/app/build.gradle"
                  )
          
              text = text.replace(
                  marker,
                  signing_block + "\n" + marker,
                  1
              )
          
          if "signingConfig signingConfigs.release" not in text:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"
          
              replacement = (
                  r"\1\n"
                  r"        signingConfig signingConfigs.release"
              )
          
              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )
          
              if count == 0:
                  raise SystemExit(
                      "Could not find buildTypes.release"
                  )
          
          file.write_text(text)
          
          print("Android release signing configured successfully.")
          PY

      - name: Check Java
        script: |
          java -version

      - name: Check signing variables
        script: |
          test -f "$CM_KEYSTORE_PATH"
          echo "Keystore found"
          echo "Alias: $CM_KEY_ALIAS"

      - name: Get signing SHA-1
        script: |
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA-1:"

      - name: Check Firebase configuration
        script: |
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Build signed APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew clean
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
