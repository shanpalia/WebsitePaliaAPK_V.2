workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120
    environment:
      node: latest
      java: 21
      android_signing:
        - paliaapk-release
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install
          npm install firebase@12.6.0 @capacitor-firebase/authentication@8.3.0

      - name: Prepare web assets
        script: |
          set -e
          rm -rf www android
          mkdir -p www
          test -f index.html
          cp index.html www/index.html
          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then cp "$file" www/; fi
          done
          [ ! -d assets ] || cp -r assets www/
          [ ! -d images ] || cp -r images www/
          test -f node_modules/@capacitor/core/dist/capacitor.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          # Use the plugin's official no-bundler build. It is specifically published as dist/plugin.js.
          test -f node_modules/@capacitor-firebase/authentication/dist/plugin.js
          cp node_modules/@capacitor-firebase/authentication/dist/plugin.js www/firebase-authentication-plugin.js
          python3 - <<'PY'
          from pathlib import Path
          for p in Path('www').glob('*.html'):
              s=p.read_text()
              # remove any old auth script and any old capacitor runtime includes
              import re
              s=re.sub(r'\s*<script[^>]+src=["\']capacitor-auth\.js["\'][^>]*></script>', '', s, flags=re.I)
              s=re.sub(r'\s*<script[^>]+src=["\']capacitor\.js["\'][^>]*></script>', '', s, flags=re.I)
              if '<head>' in s:
                  s=s.replace('<head>', '<head>\n    <script src="capacitor.js"></script>\n    <script src="firebase-authentication-plugin.js"></script>', 1)
              else:
                  s='<script src="capacitor.js"></script>\n<script src="firebase-authentication-plugin.js"></script>\n'+s
              p.write_text(s)
          PY
          test -s www/capacitor.js
          test -s www/firebase-authentication-plugin.js

      - name: Create Android project and sync official plugins
        script: |
          set -e
          npx cap add android
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/variables.gradle')
          s=p.read_text()
          if 'rgcfaIncludeGoogle' not in s:
              if 'ext {' in s:
                  s=s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",1)
              else:
                  s += "\next {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'\n}\n"
              p.write_text(s)
          PY
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          npx cap update android
          npx cap sync android

      - name: Verify official Firebase Authentication integration
        script: |
          set -e
          echo '--- Capacitor config ---'
          npx cap config | grep -E "appId|appName|webDir" -A1
          echo '--- Native plugin metadata ---'
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -q '@capacitor-firebase/authentication' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'FirebaseAuthenticationPlugin' android/app/src/main/assets/capacitor.plugins.json
          echo 'Official FirebaseAuthentication plugin metadata found.'
          echo '--- Native module wiring ---'
          grep -R -q 'capacitor-firebase-authentication' android/capacitor.settings.gradle android/app/capacitor.build.gradle
          echo 'Official native FirebaseAuthentication module found in generated Gradle files.'
          echo '--- Google dependency flag ---'
          grep -q 'rgcfaIncludeGoogle = true' android/variables.gradle
          echo 'Google provider dependency enabled.'
          echo '--- Web plugin bundle ---'
          test -s www/firebase-authentication-plugin.js
          grep -q 'FirebaseAuthentication' www/firebase-authentication-plugin.js
          echo 'Official no-bundler FirebaseAuthentication JS bundle present.'

      - name: Generate app assets
        script: |
          set -e
          npx @capacitor/assets generate --android

      - name: Configure Android signing
        script: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('android/app/build.gradle')
          s=p.read_text()
          # Keep Codemagic's generated signing configuration intact; only ensure release uses it if available.
          print('Android signing configuration left to Codemagic signing integration.')
          PY

      - name: Build release APK
        script: |
          set -e
          cd android
          ./gradlew assembleRelease --no-daemon

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
