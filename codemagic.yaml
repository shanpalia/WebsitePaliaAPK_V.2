workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120

    environment:
      node: latest
      java: 21

      android_signing:
        - paliaapk-release

    scripts:
      - name: Install dependencies
        script: |
          npm install
          npm install firebase
          npm install @capacitor/push-notifications@8.1.2
          npm install @capacitor-firebase/authentication@8.3.0
          npm install -D esbuild

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www

          if [ ! -f index.html ]; then
            echo "ERROR: Root index.html not found"
            pwd
            ls -la
            exit 1
          fi

          cp index.html www/index.html

          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then
              cp "$file" www/
            fi
          done

          if [ -d "assets" ]; then
            cp -r assets www/
          fi

          if [ -d "images" ]; then
            cp -r images www/
          fi

          test -f www/index.html

          echo "===== WWW CONTENT ====="
          ls -la www

      - name: Create Firebase Auth bridge
        script: |
          cat > capacitor-auth-entry.js <<'EOF'
          import { FirebaseAuthentication } from '@capacitor-firebase/authentication';

          window.FirebaseAuthentication = FirebaseAuthentication;
          EOF

          npx esbuild capacitor-auth-entry.js \
            --bundle \
            --format=iife \
            --platform=browser \
            --outfile=www/capacitor-auth.js

          test -s www/capacitor-auth.js

          echo "Firebase Authentication bridge created."

      - name: Create Android project
        script: |
          rm -rf android
          npx cap add android

      - name: Configure Firebase Google Sign-In
        script: |
          python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("android/variables.gradle")

          if not gradle_file.exists():
              raise SystemExit("android/variables.gradle not found")

          text = gradle_file.read_text()

          if "rgcfaIncludeGoogle" not in text:
              if "ext {" in text:
                  text = text.replace(
                      "ext {",
                      """ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'""",
                      1
                  )
              else:
                  text += """

          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          """

          gradle_file.write_text(text)

          print("Firebase Google Sign-In configured.")
          PY

          echo "===== variables.gradle ====="
          cat android/variables.gradle

      - name: Add Firebase configuration
        script: |
          mkdir -p android/app

          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase google-services.json added successfully."

      - name: Generate PaliaAPK HUB icon
        script: |
          npx @capacitor/assets generate --android

      - name: Update Capacitor Native Plugins
        script: |
          npx cap update android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Verify Firebase Native Plugin
        script: |
          set -e

          echo "===== NPM PACKAGE ====="
          npm list @capacitor-firebase/authentication

          echo "===== CAPACITOR PLUGINS ====="
          npx cap ls

          echo "===== CAPACITOR PLUGIN JSON ====="
          test -f android/app/src/main/assets/capacitor.plugins.json
          cat android/app/src/main/assets/capacitor.plugins.json

          echo "===== FIREBASE AUTH CLASS ====="
          find android -type f \
            \( -iname "*FirebaseAuthentication*" -o -iname "*FirebaseAuthenticationPlugin*" \) \
            -print

          echo "===== NATIVE REGISTRATION ====="
          grep -R "FirebaseAuthenticationPlugin" android \
            --exclude-dir=build \
            --exclude-dir=.gradle \
            || true

          echo "===== JS BRIDGE ====="
          test -s www/capacitor-auth.js
          grep -q "FirebaseAuthentication" www/capacitor-auth.js

          echo "===== ALL CHECKS PASSED ====="

      - name: Configure Android signing
        script: |
          python3 <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()

          if "signingConfigs {" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              """

              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "Could not find buildTypes in android/app/build.gradle"
                  )

              text = text.replace(
                  marker,
                  signing_block + "\n" + marker,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"

              replacement = (
                  r"\1\n"
                  r"        signingConfig signingConfigs.release"
              )

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Could not find buildTypes.release"
                  )

          gradle_file.write_text(text)

          print("Android release signing configured successfully.")
          PY

      - name: Check Java
        script: |
          java -version

      - name: Check signing variables
        script: |
          test -f "$CM_KEYSTORE_PATH"
          echo "Keystore found"
          echo "Alias: $CM_KEY_ALIAS"

      - name: Get signing SHA-1
        script: |
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA-1:"

      - name: Check Firebase configuration
        script: |
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Build signed APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
