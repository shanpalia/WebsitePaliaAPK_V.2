workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120

    environment:
      node: latest
      java: 21

      android_signing:
        - paliaapk-release

    scripts:

      - name: Install dependencies
        script: |
          npm install
          npm install firebase
          npm install @capacitor/push-notifications@8.1.2
          npm install @capacitor-firebase/authentication@8.3.0
          npm install -D esbuild

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -mindepth 1 \
            ! -name "www" \
            ! -name "android" \
            ! -name "node_modules" \
            ! -name ".git" \
            ! -name "server" \
            ! -name "package.json" \
            ! -name "package-lock.json" \
            ! -name "capacitor.config.ts" \
            ! -name "codemagic.yaml" \
            ! -name "*.md" \
            -exec cp -r {} www/ \;

          test -f www/index.html

      - name: Create Android project
        script: |
          npx cap add android

      - name: Configure Firebase Google Sign-In
        script: |
          python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("android/variables.gradle")

          if not gradle_file.exists():
              raise SystemExit("android/variables.gradle not found")

          text = gradle_file.read_text()

          # Add Google Sign-In variables inside the existing ext block
          if "rgcfaIncludeGoogle" not in text:
              text = text.replace(
                  "ext {",
                  "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",
                  1
              )

          gradle_file.write_text(text)

          print("Firebase Google Sign-In configuration added.")
          PY

          echo "----- variables.gradle -----"
          cat android/variables.gradle

      - name: Add Firebase configuration
        script: |
          mkdir -p android/app

          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase google-services.json added successfully."

      - name: Create Firebase Auth bridge
        script: |
          cat > capacitor-auth-entry.js <<'EOF'
          import { FirebaseAuthentication } from '@capacitor-firebase/authentication';

          export { FirebaseAuthentication };
          EOF

          npx esbuild capacitor-auth-entry.js \
            --bundle \
            --format=esm \
            --platform=browser \
            --outfile=www/capacitor-auth.js

          test -s www/capacitor-auth.js

          echo "Firebase Authentication bridge created."

          echo "----- bridge check -----"
          grep -o "FirebaseAuthentication" www/capacitor-auth.js | head

      - name: Generate PaliaAPK HUB icon
        script: |
          npx @capacitor/assets generate --android

      - name: Update and Sync Capacitor
        script: |
          npx cap update android
          npx cap sync android

      - name: Verify Firebase Authentication plugin
        script: |
          echo "===== Installed Firebase Authentication ====="
          npm list @capacitor-firebase/authentication firebase || true

          echo "===== Capacitor plugins ====="
          npx cap ls

          echo "===== Native plugin registration ====="
          if grep -Rq "@capacitor-firebase/authentication" android/app/src android/capacitor.settings.gradle android/app/capacitor.build.gradle 2>/dev/null; then
            echo "Firebase Authentication native plugin detected."
          else
            echo "ERROR: Firebase Authentication native plugin NOT detected."
            exit 1
          fi

      - name: Configure Android signing
        script: |
          python3 <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()

          if "signingConfigs {" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              """

              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "Could not find buildTypes in android/app/build.gradle"
                  )

              text = text.replace(
                  marker,
                  signing_block + "\n" + marker,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"

              replacement = (
                  r"\1\n"
                  r"        signingConfig signingConfigs.release"
              )

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Could not find buildTypes.release"
                  )

          gradle_file.write_text(text)

          print("Android release signing configured successfully.")
          PY

      - name: Check Java
        script: |
          java -version

      - name: Check signing variables
        script: |
          test -f "$CM_KEYSTORE_PATH"
          echo "Keystore found"
          echo "Alias: $CM_KEY_ALIAS"

      - name: Get signing SHA-1
        script: |
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA-1:"

      - name: Check Firebase configuration
        script: |
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Build signed APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
