workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120

    environment:
      node: latest
      java: 21

    scripts:

      - name: Install dependencies
        script: |
          npm install

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -mindepth 1 \
            ! -name "www" \
            ! -name "android" \
            ! -name "node_modules" \
            ! -name ".git" \
            ! -name "server" \
            ! -name "package.json" \
            ! -name "package-lock.json" \
            ! -name "capacitor.config.ts" \
            ! -name "codemagic.yaml" \
            ! -name "*.md" \
            -exec cp -r {} www/ \;

          test -f www/index.html

      - name: Create Android project
        script: |
          npx cap add android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Check Java
        script: |
          java -version

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
