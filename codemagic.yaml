workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120

    instance_type: linux_x2

    environment:
      node: latest

    scripts:
      - name: Install dependencies
        script: |
          npm install

      - name: Create Android project
        script: |
          npx cap add android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Build APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
