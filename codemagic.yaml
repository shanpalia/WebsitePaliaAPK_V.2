workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120

    environment:
      node: latest
      java: 21

      android_signing:
        - paliaapk-release

    scripts:

      - name: Install dependencies
        script: |
          npm install
          npm install @capacitor/push-notifications@8.1.2
          npm install @capacitor-firebase/authentication@8.3.0

      - name: Prepare web assets
        script: |
          rm -rf www
          mkdir -p www

          find . -maxdepth 1 -mindepth 1 \
            ! -name "www" \
            ! -name "android" \
            ! -name "node_modules" \
            ! -name ".git" \
            ! -name "server" \
            ! -name "package.json" \
            ! -name "package-lock.json" \
            ! -name "capacitor.config.ts" \
            ! -name "codemagic.yaml" \
            ! -name "*.md" \
            -exec cp -r {} www/ \;

          test -f www/index.html

      - name: Create Android project
        script: |
          npx cap add android

      - name: Configure Firebase Google Sign-In
        script: |
          python3 <<'PY'
          from pathlib import Path

          gradle_file = Path("android/variables.gradle")

          if not gradle_file.exists():
              raise SystemExit("android/variables.gradle not found")

          text = gradle_file.read_text()

          if "rgcfaIncludeGoogle" not in text:
              text += """

          ext {
              rgcfaIncludeGoogle = true
              androidxCredentialsVersion = '1.3.0'
          }
          """

          gradle_file.write_text(text)

          print("Firebase Google Sign-In native dependencies configured.")
          PY

      - name: Add Firebase configuration
        script: |
          mkdir -p android/app

          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
            > android/app/google-services.json

          test -s android/app/google-services.json

          echo "Firebase google-services.json added successfully."

      - name: Generate PaliaAPK HUB icon
        script: |
          npx @capacitor/assets generate --android

      - name: Sync Capacitor
        script: |
          npx cap sync android

      - name: Configure Android signing
        script: |
          python3 <<'PY'
          from pathlib import Path
          import re

          gradle_file = Path("android/app/build.gradle")
          text = gradle_file.read_text()

          if "signingConfigs {" not in text:
              signing_block = """
              signingConfigs {
                  release {
                      storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                      storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("CM_KEY_ALIAS")
                      keyPassword System.getenv("CM_KEY_PASSWORD")
                  }
              }
              """

              marker = "    buildTypes {"

              if marker not in text:
                  raise SystemExit(
                      "Could not find buildTypes in android/app/build.gradle"
                  )

              text = text.replace(
                  marker,
                  signing_block + "\n" + marker,
                  1
              )

          if "signingConfig signingConfigs.release" not in text:
              pattern = r"(buildTypes\s*\{\s*release\s*\{)"

              replacement = (
                  r"\1\n"
                  r"        signingConfig signingConfigs.release"
              )

              text, count = re.subn(
                  pattern,
                  replacement,
                  text,
                  count=1
              )

              if count == 0:
                  raise SystemExit(
                      "Could not find buildTypes.release"
                  )

          gradle_file.write_text(text)

          print("Android release signing configured successfully.")
          PY

      - name: Check Java
        script: |
          java -version

      - name: Check signing variables
        script: |
          test -f "$CM_KEYSTORE_PATH"
          echo "Keystore found"
          echo "Alias: $CM_KEY_ALIAS"

      - name: Get signing SHA-1
        script: |
          keytool -list -v \
            -keystore "$CM_KEYSTORE_PATH" \
            -alias "$CM_KEY_ALIAS" \
            -storepass "$CM_KEYSTORE_PASSWORD" \
            | grep -E "SHA1:|SHA-1:"

      - name: Check Firebase configuration
        script: |
          test -f android/app/google-services.json
          echo "Firebase configuration found."

      - name: Build signed APK
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
