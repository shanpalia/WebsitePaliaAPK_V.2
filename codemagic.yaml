scripts:
  - name: Install dependencies
    script: |
      npm install
      npm install firebase
      npm install @capacitor/push-notifications@8.1.2
      npm install @capacitor-firebase/authentication@8.3.0
      npm install -D esbuild

  - name: Prepare web assets
    script: |
      rm -rf www
      mkdir -p www

      if [ ! -f index.html ]; then
        echo "ERROR: Root index.html not found"
        exit 1
      fi

      cp index.html www/index.html

      for file in *.html *.js *.css; do
        if [ -f "$file" ] && [ "$file" != "index.html" ]; then
          cp "$file" www/
        fi
      done

      if [ -d "assets" ]; then
        cp -r assets www/
      fi

      if [ -d "images" ]; then
        cp -r images www/
      fi

      test -f www/index.html

  - name: Create Firebase Auth bridge
    script: |
      cat > capacitor-auth-entry.js <<'EOF'
      import { FirebaseAuthentication } from '@capacitor-firebase/authentication';

      window.FirebaseAuthentication = FirebaseAuthentication;
      EOF

      npx esbuild capacitor-auth-entry.js \
        --bundle \
        --format=iife \
        --platform=browser \
        --outfile=www/capacitor-auth.js

      test -s www/capacitor-auth.js

  - name: Create Android project
    script: |
      rm -rf android
      npx cap add android

  - name: Configure Firebase Google Sign-In
    script: |
      python3 <<'PY'
      from pathlib import Path

      file = Path("android/variables.gradle")
      text = file.read_text()

      if "rgcfaIncludeGoogle" not in text:
          if "ext {" in text:
              text = text.replace(
                  "ext {",
                  """ext {
          rgcfaIncludeGoogle = true
          androidxCredentialsVersion = '1.3.0'""",
                  1
              )

      file.write_text(text)
      PY

      cat android/variables.gradle

  - name: Add Firebase configuration
    script: |
      mkdir -p android/app

      printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" \
        > android/app/google-services.json

      test -s android/app/google-services.json

  - name: Generate PaliaAPK HUB icon
    script: |
      npx @capacitor/assets generate --android

  - name: Update Capacitor Native Plugins
    script: |
      npx cap update android

  - name: Sync Capacitor
    script: |
      npx cap sync android

  - name: Verify Firebase Native Plugin
    script: |
      set -e

      echo "===== 1. NPM PACKAGE ====="
      npm list @capacitor-firebase/authentication

      echo "===== 2. CAPACITOR PLUGINS ====="
      npx cap ls

      echo "===== 3. PLUGIN JSON ====="
      test -f android/app/src/main/assets/capacitor.plugins.json
      cat android/app/src/main/assets/capacitor.plugins.json

      echo "===== 4. FIREBASE NATIVE CLASS ====="
      find android -type f \
        \( -iname "*FirebaseAuthentication*" -o -iname "*FirebaseAuthenticationPlugin*" \) \
        -print

      echo "===== 5. NATIVE REGISTRATION ====="
      grep -R "FirebaseAuthenticationPlugin" android \
        --exclude-dir=build \
        --exclude-dir=.gradle \
        || true

      echo "===== 6. CAPACITOR FIREBASE GRADLE ====="
      grep -R "capacitor-firebase" android \
        --exclude-dir=build \
        --exclude-dir=.gradle \
        || true

      echo "===== 7. JS BRIDGE ====="
      test -f www/capacitor-auth.js
      grep -q "FirebaseAuthentication" www/capacitor-auth.js

      echo "===== 8. ANDROID ASSETS ====="
      ls -la android/app/src/main/assets/

      echo "===== DIAGNOSTIC COMPLETE ====="

  - name: Configure Android signing
    script: |
      python3 <<'PY'
      from pathlib import Path
      import re

      file = Path("android/app/build.gradle")
      text = file.read_text()

      if "signingConfigs {" not in text:
          signing_block = """
          signingConfigs {
              release {
                  storeFile file(System.getenv("CM_KEYSTORE_PATH"))
                  storePassword System.getenv("CM_KEYSTORE_PASSWORD")
                  keyAlias System.getenv("CM_KEY_ALIAS")
                  keyPassword System.getenv("CM_KEY_PASSWORD")
              }
          }
          """

          text = text.replace(
              "    buildTypes {",
              signing_block + "\n    buildTypes {",
              1
          )

      if "signingConfig signingConfigs.release" not in text:
          text = re.sub(
              r"(buildTypes\s*\{\s*release\s*\{)",
              r"\1\n        signingConfig signingConfigs.release",
              text,
              count=1
          )

      file.write_text(text)
      PY

  - name: Check Java
    script: |
      java -version

  - name: Check signing variables
    script: |
      test -f "$CM_KEYSTORE_PATH"
      echo "Keystore found"
      echo "Alias: $CM_KEY_ALIAS"

  - name: Get signing SHA-1
    script: |
      keytool -list -v \
        -keystore "$CM_KEYSTORE_PATH" \
        -alias "$CM_KEY_ALIAS" \
        -storepass "$CM_KEYSTORE_PASSWORD" \
        | grep -E "SHA1:|SHA-1:"

  - name: Check Firebase configuration
    script: |
      test -f android/app/google-services.json
      echo "Firebase configuration found."

  - name: Build signed APK
    script: |
      cd android
      chmod +x gradlew
      ./gradlew assembleRelease

artifacts:
  - android/app/build/outputs/apk/release/*.apk
