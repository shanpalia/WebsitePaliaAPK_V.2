workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120
    environment:
      node: latest
      java: 21
      android_signing:
        - paliaapk-release
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install

      - name: Prepare web assets
        script: |
          set -e
          rm -rf www android
          mkdir -p www
          test -f index.html
          cp index.html www/index.html
          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then cp "$file" www/; fi
          done
          [ ! -d assets ] || cp -r assets www/
          [ ! -d images ] || cp -r images www/
          python3 prepare_web_assets.py

      - name: Create Android project and sync Capacitor
        script: |
          set -e
          npx cap add android
          npx cap sync android
          test -d android
          test -f android/app/src/main/assets/capacitor.config.json
          echo "Capacitor Android project created successfully."

      - name: Generate app assets
        script: |
          set -e
          npx @capacitor/assets generate --android

      - name: Configure Android release signing
        script: |
          set -e
          python3 configure_signing.py
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"

      - name: Build signed release APK
        script: |
          set -e
          cd android
          ./gradlew assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PaliaAPK HUB.apk"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
