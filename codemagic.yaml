workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120
    environment:
      node: latest
      java: 21
      android_signing:
        - paliaapk-release
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install

      - name: Prepare web assets
        script: |
          set -e
          rm -rf www android
          mkdir -p www
          test -f index.html
          cp index.html www/index.html
          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then cp "$file" www/; fi
          done
          [ ! -d assets ] || cp -r assets www/
          [ ! -d images ] || cp -r images www/
          python3 prepare_web_assets.py

      - name: Create Android project and sync Capacitor
        script: |
          set -e
          npx cap add android
          npx cap sync android
          test -d android
          test -f android/app/src/main/assets/capacitor.config.json
          echo "Capacitor Android project created successfully."

      - name: Configure native Google Credential Manager
        script: |
          set -e
          python3 configure_native_google.py
          test -f android/app/src/main/java/com/shanpalia/paliaapkhub/PaliaGoogleAuthPlugin.java
          grep -q 'PaliaGoogleAuthPlugin.class' android/app/src/main/java/com/shanpalia/paliaapkhub/MainActivity.java
          grep -q 'androidx.credentials:credentials:1.3.0' android/app/build.gradle
          echo "Native Google Credential Manager configured."

      - name: Configure native APK downloader
        script: |
          set -e
          python3 configure_native_downloader.py
          test -f android/app/src/main/java/com/shanpalia/paliaapkhub/PaliaDownloaderPlugin.java
          grep -q 'registerPlugin(PaliaDownloaderPlugin.class)' android/app/src/main/java/com/shanpalia/paliaapkhub/MainActivity.java
          grep -q '@CapacitorPlugin(name = "PaliaDownloader")' android/app/src/main/java/com/shanpalia/paliaapkhub/PaliaDownloaderPlugin.java
          grep -q 'getProgress' android/app/src/main/java/com/shanpalia/paliaapkhub/PaliaDownloaderPlugin.java
          grep -q 'openInstaller' android/app/src/main/java/com/shanpalia/paliaapkhub/PaliaDownloaderPlugin.java
          grep -q 'REQUEST_INSTALL_PACKAGES' android/app/src/main/AndroidManifest.xml
          echo "Native APK downloader configured: real progress + installer."

      - name: Generate app assets
        script: |
          set -e
          npx @capacitor/assets generate --android

      - name: Configure Android release signing
        script: |
          set -e
          python3 configure_signing.py
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"

      - name: Check release signing certificate
        script: |
          set -e
          echo "Release signing certificate SHA-1 (add this to Firebase if it differs from google-services.json):"
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -storepass "$CM_KEYSTORE_PASSWORD" -alias "$CM_KEY_ALIAS" | grep -E 'SHA1:|SHA-1:' || true

      - name: Build signed release APK
        script: |
          set -e
          cd android
          ./gradlew assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PaliaAPK HUB.apk"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
