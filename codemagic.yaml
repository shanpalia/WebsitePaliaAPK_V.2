workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120
    environment:
      node: latest
      java: 21
      android_signing:
        - paliaapk-release
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install
          npm install @capacitor-firebase/authentication@8.3.0 firebase

      - name: Prepare web assets
        script: |
          set -e
          rm -rf www android
          mkdir -p www
          cp index.html www/index.html
          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then cp "$file" www/; fi
          done
          if [ -d assets ]; then cp -r assets www/assets; fi
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          test -s www/capacitor.js
          python3 -c "from pathlib import Path; [p.write_text(p.read_text().replace('<script src=\"capacitor.js\"></script>','').replace('<script src=\"capacitor-auth.js\"></script>','').replace('<head>','<head>\\n    <script src=\"capacitor.js\"></script>\\n    <script src=\"capacitor-auth.js\"></script>',1)) for p in Path('www').glob('*.html')]"

      - name: Verify JS bridge
        script: |
          set -e
          grep -q 'registerPlugin("FirebaseAuthentication")' www/capacitor-auth.js
          grep -q 'src="capacitor.js"' www/user.html
          grep -q 'src="capacitor-auth.js"' www/user.html

      - name: Create Android project and sync plugins
        script: |
          set -e
          npx cap add android
          mkdir -p android/app
          printf '%s' "$FIREBASE_GOOGLE_SERVICES_JSON" > android/app/google-services.json
          test -s android/app/google-services.json
          npx cap sync android

      - name: Configure Google Sign-In
        script: |
          set -e
          python3 -c "from pathlib import Path; p=Path('android/variables.gradle'); s=p.read_text(); s=(s.replace('ext {', "ext {\n    rgcfaIncludeGoogle = true\n    androidxCredentialsVersion = '1.3.0'",1) if 'rgcfaIncludeGoogle' not in s and 'ext {' in s else s); p.write_text(s)"
          npx cap update android
          npx cap sync android

      - name: Verify native Firebase plugin
        script: |
          set -e
          test -d node_modules/@capacitor-firebase/authentication/android
          test -f android/app/src/main/assets/capacitor.plugins.json
          grep -q '@capacitor-firebase/authentication' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'FirebaseAuthenticationPlugin' android/app/src/main/assets/capacitor.plugins.json
          grep -q 'capacitor-firebase-authentication' android/capacitor.settings.gradle
          echo "Native FirebaseAuthentication plugin is registered by Capacitor sync."

      - name: Configure Android signing
        script: |
          set -e
          python3 -c "from pathlib import Path; import re; p=Path('android/app/build.gradle'); s=p.read_text(); block=\"    signingConfigs {\n        release {\n            storeFile file(System.getenv('CM_KEYSTORE_PATH'))\n            storePassword System.getenv('CM_KEYSTORE_PASSWORD')\n            keyAlias System.getenv('CM_KEY_ALIAS')\n            keyPassword System.getenv('CM_KEY_PASSWORD')\n        }\n    }\n\n\"; s=s.replace('    buildTypes {',block+'    buildTypes {',1) if 'signingConfigs {' not in s else s; s=re.sub(r'(buildTypes\s*\{\s*release\s*\{)',r'\1\n            signingConfig signingConfigs.release',s,count=1) if 'signingConfig signingConfigs.release' not in s else s; p.write_text(s)"

      - name: Check signing
        script: |
          set -e
          test -f "$CM_KEYSTORE_PATH"
          keytool -list -v -keystore "$CM_KEYSTORE_PATH" -alias "$CM_KEY_ALIAS" -storepass "$CM_KEYSTORE_PASSWORD" | grep -E 'SHA1:|SHA-1:'

      - name: Build signed APK
        script: |
          set -e
          cd android
          chmod +x gradlew
          ./gradlew clean assembleRelease
    artifacts:
      - android/app/build/outputs/apk/release/*.apk
