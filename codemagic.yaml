workflows:
  android-apk:
    name: PaliaAPK HUB Android
    max_build_duration: 120
    environment:
      node: latest
      java: 21
      android_signing:
        - paliaapk-release
    scripts:
      - name: Install dependencies
        script: |
          set -e
          npm install

      - name: Prepare web assets
        script: |
          set -e
          rm -rf www android
          mkdir -p www
          test -f index.html
          cp index.html www/index.html
          for file in *.html *.js *.css; do
            if [ -f "$file" ] && [ "$file" != "index.html" ]; then cp "$file" www/; fi
          done
          [ ! -d assets ] || cp -r assets www/
          [ ! -d images ] || cp -r images www/
          test -f node_modules/@capacitor/core/dist/capacitor.js
          cp node_modules/@capacitor/core/dist/capacitor.js www/capacitor.js
          python3 -c 'from pathlib import Path; import re; files=list(Path("www").glob("*.html")); [p.write_text((lambda s: (re.sub(r"\\s*<script[^>]+src=[\"\\\']capacitor-auth\\.js[\"\\\'][^>]*></script>", "", re.sub(r"\\s*<script[^>]+src=[\"\\\']firebase-authentication-plugin\\.js[\"\\\'][^>]*></script>", "", re.sub(r"\\s*<script[^>]+src=[\"\\\']capacitor\\.js[\"\\\'][^>]*></script>", "", s, flags=re.I), flags=re.I), flags=re.I)).replace("<head>", "<head>\\n    <script src=\\"capacitor.js\\"></script>", 1) if "<head>" in s else "<script src=\\"capacitor.js\\"></script>\\n"+s)) for p in files]'
          test -s www/capacitor.js

      - name: Create Android project and sync Capacitor
        script: |
          set -e
          npx cap add android
          npx cap sync android
          test -d android
          test -f android/app/src/main/assets/capacitor.config.json
          echo "Capacitor Android project created successfully."

      - name: Generate app assets
        script: |
          set -e
          npx @capacitor/assets generate --android

      - name: Configure Android release signing
        script: |
          set -e
          python3 configure_signing.py
          grep -q 'signingConfig signingConfigs.release' android/app/build.gradle
          test -n "${CM_KEYSTORE_PATH:-}"
          test -f "$CM_KEYSTORE_PATH"

      - name: Build signed release APK
        script: |
          set -e
          cd android
          ./gradlew assembleRelease --no-daemon
          APK="app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          apksigner verify --verbose "$APK"
          cp "$APK" "app/build/outputs/apk/release/PaliaAPK HUB.apk"

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
